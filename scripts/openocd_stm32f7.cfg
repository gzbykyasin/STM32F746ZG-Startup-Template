# OpenOCD configuration for STM32F746ZG Nucleo-144 board
# Uses ST-LINK/V2-1 or V3 depending on the board version, stlink.cfg handles both

source [find interface/stlink.cfg]
transport select hla_swd

# Set up the target MCU
source [find target/stm32f7x.cfg]

# Reset configuration
reset_config srst_only
